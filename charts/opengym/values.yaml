# -- API workload configuration.
api:
  # -- Additional labels for the API Deployment and Service.
  labels: {}
  # -- Number of API replicas.
  replicaCount: 1
  image:
    # -- API container image repository.
    repository: registry.gitlab.com/duartesantos8/opengym/api
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Immutable image tag. Set either tag or digest.
    tag: "1.3.8"
    # -- Image digest, preferred over tag.
    digest: ""
  # -- API listening port.
  port: 3000
  service:
    # -- Additional labels for the API Service.
    labels: {}
    # -- API Service type.
    type: ClusterIP
    # -- API Service annotations.
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  # -- API readiness probe.
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
  # -- API liveness probe.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15

# -- Web workload configuration.
web:
  # -- Additional labels for the web Deployment and Service.
  labels: {}
  # -- Number of web replicas.
  replicaCount: 1
  image:
    # -- Web container image repository.
    repository: registry.gitlab.com/duartesantos8/opengym/web
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Immutable image tag. Set either tag or digest.
    tag: "1.3.8"
    # -- Image digest, preferred over tag.
    digest: ""
  # -- Nginx listening port inside the container.
  containerPort: 80
  service:
    # -- Additional labels for the web Service.
    labels: {}
    # -- Web Service type.
    type: ClusterIP
    # -- Web Service port.
    port: 8080
    # -- Web Service annotations.
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  # -- Web container security context. Nginx needs CHOWN during startup to
  # -- prepare its cache directories.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
      add:
        - CHOWN
        - SETGID
        - SETUID
  # -- Web readiness probe.
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5

# -- Non-secret application configuration.
config:
  # -- Additional labels for the application ConfigMap.
  labels: {}
  # -- Directory used by the API for persistent data.
  dataDir: /data
  # -- WebAuthn relying-party ID. Defaults to the ingress host.
  rpId: ""
  # -- Application origin. Defaults to the HTTPS ingress origin.
  origin: ""
  # -- Name shown in the passkey prompt.
  rpName: openGym
  # -- Sign-in lifetime in days.
  sessionDays: 90
  # -- Comma-separated user IDs granted administrator access.
  adminUids: ""
  # -- Require an invite code to create a profile.
  inviteOnly: ""
  # -- Allow guest mode. Set to "0" to disable it.
  allowGuest: ""
  # -- Enable the activity log. Set to "0" to disable it.
  auditLog: ""
  # -- Maximum number of activity log events. Set to 0 for no limit.
  auditMax: 5000
  # -- Number of days to retain activity log events. Set to 0 for no limit.
  auditDays: 90
  # -- Activity log IP address mode: off, net, or full.
  auditIp: off
  # -- Contact address for push notifications. Defaults to the application origin.
  vapidSubject: ""
  # -- NGINX DNS Resolver address.
  resolver: 127.0.0.1

# -- API persistent data volume configuration.
data:
  # -- Additional labels for the data PVC.
  labels: {}
  # -- PersistentVolumeClaim annotations.
  annotations: {}
  # -- Requested storage size.
  storage: 1Gi
  # -- PersistentVolumeClaim access modes.
  accessModes:
    - ReadWriteOnce
  # -- Storage class, or empty to use the cluster default.
  storageClassName: ""

# -- Shared exercise media volume configuration.
media:
  # -- Additional labels for the media PVC.
  labels: {}
  # -- PersistentVolumeClaim annotations.
  annotations: {}
  # -- Requested storage size.
  storage: 512Mi
  # -- PersistentVolumeClaim access modes.
  accessModes:
    - ReadWriteOnce
  # -- Storage class, or empty to use the cluster default.
  storageClassName: ""
  loader:
    # -- Download exercise media into the volume before starting the web pod.
    enabled: true
    # -- Media loader image.
    image: alpine/git
    # -- Media loader image pull policy.
    imagePullPolicy: IfNotPresent
    # -- Exercise media repository.
    repository: https://github.com/hasaneyldrm/exercises-dataset

# -- Ingress configuration.
ingress:
  # -- Additional labels for the Ingress.
  labels: {}
  # -- Enable the web Ingress.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations: {}
  # -- Public hostname.
  host: ""
  # -- URL path.
  path: /
  # -- URL path matching behavior.
  pathType: Prefix
  # -- Additional paths for the primary host.
  extraPaths: []
  # -- Additional Ingress rules.
  extraRules: []
  tls:
    # -- Enable TLS.
    enabled: false
    # -- TLS Secret managed by cert-manager.
    secretName: ""
  # -- Additional TLS configurations.
  extraTls: []

# -- Image pull secrets for private registries.
imagePullSecrets: []
# -- Additional labels to apply to all resources.
labels: {}
# -- Override the chart name.
nameOverride: ""
# -- Override the generated full name.
fullnameOverride: ""
# -- Additional pod annotations.
podAnnotations: {}
# -- Additional pod labels.
podLabels: {}
# -- Pod security context.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
# -- Container security context.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
# -- Optional startup probe settings for the API.
apiStartupProbe: {}
# -- Optional startup probe settings for the web container.
webStartupProbe: {}
# -- Deployment update strategy. Recreate avoids overlapping pods using
# -- ReadWriteOnce persistent volumes during upgrades.
deploymentStrategy: Recreate
# -- Node selector.
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
