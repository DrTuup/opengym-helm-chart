apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengym.fullname" . }}-web
  labels:
    {{- include "opengym.labels" (dict "root" . "extraLabels" .Values.web.service.labels) | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "opengym.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
